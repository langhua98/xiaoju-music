<style>
:root{
  --bg:#0c0a09;--fg:#fafaf9;--muted:rgba(250,250,249,.66);--faint:rgba(250,250,249,.42);
  --line:rgba(255,255,255,.09);--glass:rgba(22,18,16,.5);--glass-strong:rgba(22,18,16,.74);
  --hover:rgba(255,255,255,.06);--accent:#fb923c;--love:#f43f5e;--ink:#1c1917;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
.ic{width:22px;height:22px;display:block;fill:currentColor}
.ic.stroke{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* 背景：当前封面放大、重度模糊，两层交替淡入淡出 */
.backdrop{position:fixed;inset:0;z-index:-1;overflow:hidden;
  background:radial-gradient(90% 70% at 15% 10%,#7c2d12 0%,transparent 60%),radial-gradient(90% 70% at 90% 95%,#3b0764 0%,transparent 60%),var(--bg)}
.art-bg{position:absolute;inset:-18%;background-size:cover;background-position:center;filter:blur(70px) saturate(1.6) brightness(.72);opacity:0;transition:opacity 1s ease}
.art-bg.show{opacity:1}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,10,9,.2),rgba(12,10,9,.62))}

/* 电脑：左边正在播放，右边歌单 */
.app{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,470px);gap:48px;height:100vh;height:100dvh;padding:40px 48px}
.stage{--disc:min(400px,36vw,46vh);align-self:center;justify-self:center;width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center}
#close{display:none}
/* 封面做成黑胶唱片：封面是中间的圆标，播放时整张唱片转，暂停就停 */
.cover-wrap{position:relative;width:var(--disc);aspect-ratio:1;border-radius:50%;box-shadow:0 30px 80px rgba(0,0,0,.6);cursor:pointer}
.cover-wrap::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:conic-gradient(from 30deg,transparent 0 40deg,rgba(255,255,255,.1) 55deg,transparent 75deg 220deg,rgba(255,255,255,.07) 235deg,transparent 255deg)}
.disc{position:absolute;inset:0;border-radius:50%;
  background:repeating-radial-gradient(circle,#141414 0 1.5px,#0a0a0a 1.5px 3px);box-shadow:inset 0 0 0 3px #1c1c1c,inset 0 0 40px rgba(0,0,0,.8);
  animation:spin 24s linear infinite;animation-play-state:paused}
body.playing .disc{animation-play-state:running}
.disc::after{content:"";position:absolute;left:50%;top:50%;width:5%;height:5%;margin:-2.5% 0 0 -2.5%;border-radius:50%;background:var(--bg);box-shadow:0 0 0 2px rgba(0,0,0,.6)}
.label{position:absolute;inset:17%;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,#fdba74,#9a3412);box-shadow:0 0 0 4px #050505}
#art{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .4s}
#art.ready{opacity:1}
.cover-fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 15%;text-align:center;color:rgba(255,255,255,.95);text-shadow:0 2px 14px rgba(0,0,0,.3);opacity:0;transition:opacity .3s}
/* 文字封面：没有自己专辑图的歌，唱片中间写歌名和歌手 */
.cover-fallback b{font-size:clamp(17px,4.6vw,28px);font-weight:800;line-height:1.22;letter-spacing:.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.cover-fallback small{max-width:100%;margin-top:8px;font-size:clamp(11px,2.6vw,14px);font-weight:500;opacity:.78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.noart .cover-fallback{opacity:1}
/* 播放页的强调色跟着封面走（进度条、当前这句歌词、按下的按钮） */
.stage{--accent:var(--theme,#fb923c)}
#seek::-webkit-slider-runnable-track{background:linear-gradient(to right,var(--accent) var(--p),rgba(255,255,255,.2) var(--p))}
#seek::-moz-range-progress{background:var(--accent)}
#close{z-index:2}
/* 跟着音乐跳的音柱 */
.viz{display:block;width:100%;height:24px;margin-top:20px;margin-bottom:-12px}
.waking{position:absolute;inset:0;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);font-size:14px;color:var(--muted);text-align:center;padding:0 24px}
.spinner{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.now{width:100%;display:flex;flex-direction:column;align-items:center;transition:transform .25s cubic-bezier(.2,.8,.2,1),opacity .25s}
.now.instant,.stage.dragging .now{transition:none}
.meta{width:100%;margin-top:28px;min-width:0;display:flex;align-items:center;gap:10px}
.meta-text{flex:1;min-width:0}
/* 歌词：点唱片（或歌词按钮）把唱片换成歌词，正在唱的那句居中、亮起来，点某一句就跳过去；
   唱片那一面在歌手下面显示正在唱的这一句 */
.lyrics{display:none;position:relative;width:100%;height:var(--disc);overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;touch-action:pan-y;
  -webkit-mask-image:linear-gradient(transparent,#000 15%,#000 85%,transparent);mask-image:linear-gradient(transparent,#000 15%,#000 85%,transparent)}
.lyrics::-webkit-scrollbar{display:none}
body.lyrics-view .cover-wrap{display:none}
body.lyrics-view .lyrics{display:block}
.lyrics ol{list-style:none;margin:0;padding:calc(var(--disc) / 2 - 20px) 0;text-align:center}
.lyrics li{padding:7px 12px;font-size:18px;font-weight:600;line-height:1.45;color:var(--faint);transition:color .3s,transform .3s}
.lyrics:not(.synced) li{color:var(--muted)}
.lyrics.synced li[data-i]{cursor:pointer}
.lyrics li.on{color:var(--fg);transform:scale(1.06)}
.lyrics li.gap{height:12px;padding:0}
.lyrics li.note{font-size:14px;font-weight:400;color:var(--faint)}
.lyrics li.retry{cursor:pointer;text-decoration:underline}
.ln{min-height:1.5em;margin-top:8px;font-size:17px;font-weight:600;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
body.lyrics-view .ln{visibility:hidden}
.t{font-size:24px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a{font-size:17px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress{width:100%;margin-top:20px}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;margin-top:4px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;margin:0;background:transparent;cursor:pointer;--p:0%}
input[type=range]:focus{outline:none}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:99px;background:linear-gradient(to right,rgba(255,255,255,.92) var(--p),rgba(255,255,255,.2) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-4.5px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.45);opacity:0;transition:opacity .15s}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:active::-webkit-slider-thumb,input[type=range]:focus-visible::-webkit-slider-thumb{opacity:1}
input[type=range]::-moz-range-track{height:5px;border-radius:99px;background:rgba(255,255,255,.2)}
input[type=range]::-moz-range-progress{height:5px;border-radius:99px;background:rgba(255,255,255,.92)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff}
@media (hover:none){input[type=range]::-webkit-slider-thumb{opacity:1}}
.controls{width:100%;display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.icon{display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:50%;background:none;cursor:pointer;opacity:.86;transition:background .15s,opacity .15s,transform .15s}
.icon:active{transform:scale(.92)}
.icon.big .ic{width:30px;height:30px}
.icon[aria-pressed=true]{color:var(--accent);opacity:1}
.icon .one{font-size:9px;font-weight:800;position:absolute;margin:1px 0 0 1px}
#repeat{position:relative}
.play{position:relative;display:grid;place-items:center;width:70px;height:70px;border:0;border-radius:50%;background:var(--fg);color:var(--ink);cursor:pointer;
  box-shadow:0 12px 32px rgba(0,0,0,.4);transition:transform .15s}
.play .ic{width:30px;height:30px}
.play:active{transform:scale(.94)}
.play.busy::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid rgba(255,255,255,.25);border-top-color:var(--accent);animation:spin .9s linear infinite}
.extras{width:100%;display:flex;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border:0;border-radius:99px;background:rgba(255,255,255,.08);color:var(--muted);font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.chip .ic{width:16px;height:16px}
.chip.on{color:var(--accent);background:rgba(255,255,255,.12)}
/* 定时关闭的选项 */
.menu{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;width:min(300px,calc(100vw - 32px));padding:8px;border-radius:18px;
  background:var(--glass-strong);-webkit-backdrop-filter:blur(30px) saturate(1.4);backdrop-filter:blur(30px) saturate(1.4);border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.55)}
.menu[hidden]{display:none}
.menu p{margin:6px 14px 4px;font-size:12px;color:var(--faint)}
.menu button{display:block;width:100%;height:46px;padding:0 14px;border:0;border-radius:12px;background:none;color:var(--fg);font:inherit;font-size:15px;text-align:left;cursor:pointer}
.menu button.on{color:var(--theme,#fb923c);font-weight:700}
@media (hover:hover){.menu button:hover,.chip:hover{background:rgba(255,255,255,.1)}}
.vol{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted)}
.vol .ic{width:18px;height:18px}
.vol input{width:110px}
/* 收藏的心：空心 → 点一下变实心，弹一下、外面散开一圈 */
.fav{position:relative;flex:none}
.fav[aria-pressed=true]{color:var(--love);opacity:1}
.fav[aria-pressed=true] .ic{fill:currentColor}
#like .ic{width:26px;height:26px}
.fav.pop .ic{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.fav.pop::after{content:"";position:absolute;inset:6px;border-radius:50%;border:2px solid var(--love);pointer-events:none;animation:burst .5s ease-out forwards}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes burst{from{transform:scale(.3);opacity:.9}to{transform:scale(1.5);opacity:0}}

.panel{min-height:0;display:flex;flex-direction:column;border-radius:22px;overflow:hidden;border:1px solid var(--line);
  background:var(--glass);-webkit-backdrop-filter:blur(34px) saturate(1.5);backdrop-filter:blur(34px) saturate(1.5)}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 20px 10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:44px;height:44px;flex:none;border-radius:13px;display:block;background:#fdfbf6;box-shadow:0 8px 20px rgba(234,88,12,.3)}
h1{font-size:20px;margin:0;line-height:1.2}
.search{display:flex;align-items:center;gap:8px;margin:6px 16px 8px;height:40px;padding:0 12px;border-radius:12px;background:rgba(255,255,255,.07);color:var(--faint)}
.search .ic{width:17px;height:17px;flex:none}
.search input{flex:1;min-width:0;height:100%;border:0;background:none;color:var(--fg);font:inherit;outline:none}
.search input::placeholder{color:var(--faint)}
/* 页签：干净的文字页签，选中的那个加粗，下面一条封面主色的小横线 */
.tabs{display:flex;gap:22px;margin:0;padding:0 20px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs .tab{flex:none}
.tab{position:relative;display:inline-flex;align-items:center;gap:4px;height:42px;padding:0;border:0;background:none;color:var(--muted);font:inherit;font-size:16px;cursor:pointer;transition:color .15s}
.tab[aria-selected=true]{color:var(--fg);font-weight:700}
.tab[aria-selected=true]::after{content:"";position:absolute;left:50%;bottom:5px;width:20px;height:3px;margin-left:-10px;border-radius:2px;background:var(--theme,#fb923c)}
.tab .ic{width:14px;height:14px;fill:var(--love)}
.tab .n{display:none}
/* 左右滑切页签：手指拖着时不要过渡动画 */
.list.swiping{transition:none}
/* 列表顶上一行小字：共多少首 / 多少个歌单 */
.count{list-style:none;padding:2px 12px 8px;font-size:12.5px;color:var(--faint)}
.list.grid .count{grid-column:1/-1;padding:0 2px}
#searchBtn{display:none}
/* 歌单这边的强调色（正在放的那首、跳动的小图标、无损标签）也跟着封面走，和页签下的小横线、播放栏一致 */
.panel{--accent:var(--theme,#fb923c)}
.list{list-style:none;margin:0;padding:4px 8px 16px;transition:transform .2s cubic-bezier(.2,.8,.2,1),opacity .2s;overflow:auto;flex:1;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
.row{display:flex;align-items:center;border-radius:12px;transition:background .15s}
.row.on{background:rgba(255,255,255,.1)}
.pick{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:8px 6px 8px 10px;border:0;border-radius:12px;background:none;text-align:left;cursor:pointer}
.row.off .pick{opacity:.42;cursor:not-allowed}
.row .fav{width:40px;height:40px;margin-right:4px;color:var(--faint)}
.row .fav .ic{width:20px;height:20px}
.row .fav[aria-pressed=true]{color:var(--love)}
/* 悬停效果只给有鼠标的设备：触屏上点过的按钮会一直停在 :hover。
   电脑上没收藏的心平时藏着，鼠标移到这一行才出来；手机上一直显示 */
@media (hover:hover){
  .icon:hover{background:var(--hover);opacity:1}
  .tab:hover{color:var(--fg)}
  .row:hover{background:var(--hover)}
  .row .fav[aria-pressed=false]{opacity:0}
  .row:hover .fav[aria-pressed=false],.row .fav[aria-pressed=false]:focus-visible{opacity:.86}
}
/* 歌单列表：两列大封面，左右排满再往下 */
.list.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:8px 16px 16px;align-content:start}
/* 歌单卡片：每个歌单一个固定的颜色；右上角斜着叠几张歌单里的专辑小图；名字大字写在左下角；右下角直接播放 */
.list.grid .card{position:relative;display:block;background:none}
.card-face{position:relative;display:block;width:100%;aspect-ratio:1/.86;border:0;border-radius:18px;overflow:hidden;padding:0;cursor:pointer;text-align:left;color:#fff;font:inherit;
  box-shadow:0 10px 26px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.15)}
.card-face::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.32));pointer-events:none}
.stack{position:absolute;inset:0}
.stack img{position:absolute;top:10%;width:40%;aspect-ratio:1;object-fit:cover;border-radius:9px;box-shadow:0 6px 16px rgba(0,0,0,.38)}
.stack .s0{right:8%;transform:rotate(7deg);z-index:3}
.stack .s1{right:23%;transform:rotate(-3deg) translateY(5%);z-index:2}
.stack .s2{right:38%;transform:rotate(-12deg) translateY(12%);z-index:1}
.card-name{position:absolute;left:14px;right:52px;bottom:30px;font-size:19px;font-weight:800;line-height:1.15;z-index:4;text-shadow:0 2px 10px rgba(0,0,0,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-name.long{font-size:15px;letter-spacing:-.3px}
.card-n{position:absolute;left:14px;bottom:11px;font-size:12px;opacity:.82;z-index:4}
.card-play{position:absolute;right:10px;bottom:10px;width:38px;height:38px;border:0;border-radius:50%;background:rgba(255,255,255,.95);color:#111;display:grid;place-items:center;z-index:5;
  box-shadow:0 4px 12px rgba(0,0,0,.3);cursor:pointer;transition:transform .15s}
.card-play:active{transform:scale(.92)}
.card-play .ic{width:16px;height:16px;margin-left:2px}
.list.grid .row{display:block}
.list.grid .pick{width:100%;flex-direction:column;align-items:stretch;gap:7px;padding:0}
.list.grid .thumb{width:100%;height:auto;aspect-ratio:1;border-radius:14px}
.list.grid .thumb.noart::after{font-size:44px}
.list.grid .info{padding:0 2px}
.list.grid .rt{font-size:14.5px}
/* 歌手页：歌手列表（圆头像 + 几首），点进去是这位歌手的歌，最上面有返回和「播放全部」 */
.thumb.round{border-radius:50%}
.artist-head{display:flex;align-items:center;gap:6px;padding:4px 4px 10px}
.artist-head .who{flex:1;min-width:0}
.artist-head .who b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist-head .who span{font-size:12.5px;color:var(--faint)}
.playall{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border:0;border-radius:99px;background:var(--accent);color:var(--ink);font-weight:600;cursor:pointer;flex:none}
.playall .ic{width:16px;height:16px}
.thumb{position:relative;width:46px;height:46px;flex:none;border-radius:9px;overflow:hidden;background:linear-gradient(135deg,#57534e,#292524)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .3s}
.thumb img.ready{opacity:1}
.thumb.noart::after{content:attr(data-ch);position:absolute;inset:0;display:grid;place-items:center;font-size:20px;font-weight:700;color:rgba(255,255,255,.92)}
.info{flex:1;min-width:0;display:flex;flex-direction:column}
.rt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.on .rt{color:var(--accent)}
.ra{font-size:12.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.badge{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);border-radius:4px;padding:0 4px;margin-right:6px;position:relative;top:-1px}
.eq{display:none;align-items:flex-end;gap:2px;width:14px;height:14px;flex:none;margin-right:4px}
.row.on .eq{display:flex}
.eq i{width:3px;height:30%;border-radius:1px;background:var(--accent)}
.row.playing .eq i{animation:eq 1s ease-in-out infinite}
.row.playing .eq i:nth-child(2){animation-delay:.25s}
.row.playing .eq i:nth-child(3){animation-delay:.5s}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}
.status{margin:24px 20px;color:var(--faint);text-align:center;font-size:14px}
.status strong{display:block;margin-bottom:4px;font-size:16px;font-weight:600;color:var(--muted)}
.status button{margin-left:8px;border:1px solid var(--line);border-radius:99px;padding:4px 12px;background:rgba(255,255,255,.06);cursor:pointer}
.skeleton .row{pointer-events:none}
.skeleton .thumb,.skeleton .rt,.skeleton .ra{background:rgba(255,255,255,.07);border-radius:6px;color:transparent}
.skeleton .rt{width:60%;height:14px;margin-bottom:6px}
.skeleton .ra{width:35%;height:11px}

.mini{display:none}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));z-index:50;max-width:calc(100vw - 32px);transform:translate(-50%,-160%);
  padding:10px 16px;border-radius:12px;background:var(--glass-strong);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--line);
  font-size:14px;transition:transform .3s ease,visibility .3s;pointer-events:none;visibility:hidden}
#toast.show{transform:translate(-50%,0);visibility:visible}
#toast.act{pointer-events:auto}
#toast button{margin-left:14px;padding:0;border:0;background:none;color:var(--accent);font-weight:700;cursor:pointer}

/* 手机：平时是歌单 + 底部迷你播放条；点播放条展开全屏「正在播放」。
   整页不滚动，只让歌单面板自己滚：页面一滚，Safari 的地址栏就缩到屏幕底部，这时点底部播放条，
   第一下会被 Safari 拿去展开地址栏，要点第二下才进得去播放页 */
@media (max-width:899px){
  body.sheet-open .panel,body.sheet-open .mini{visibility:hidden}
  .app{display:block;height:100vh;height:100dvh;padding:0}
  .panel{display:block;height:100%;overflow-y:auto;overscroll-behavior:contain;border:0;border-radius:0;background:none;-webkit-backdrop-filter:none;backdrop-filter:none}
  .head{padding:calc(16px + env(safe-area-inset-top)) 20px 6px 20px}
  .logo{width:40px;height:40px;border-radius:12px}
  h1{font-size:27px;font-weight:800;letter-spacing:.5px}
  /* 搜索收进右上角的放大镜，点了才展开 */
  /* 放大镜做成和标题一样有分量的圆形按钮 */
  #searchBtn{display:grid;width:42px;height:42px;background:rgba(255,255,255,.1);opacity:1}
  #searchBtn .ic{width:21px;height:21px;stroke-width:2.4}
  .panel.searching #searchBtn{background:var(--fg);color:var(--ink)}
  .panel:not(.searching) .search{display:none}
  .search{margin:2px 16px 6px}
  /* 页签吸顶：往下翻也一直在；贴住顶部后垫一层封面色的毛玻璃（连状态栏那块一起盖住） */
  .tabs{position:sticky;top:0;z-index:10;transition:background .3s,box-shadow .3s}
  .tabs.stuck{background:var(--theme-glass,var(--glass-strong));-webkit-backdrop-filter:blur(24px) saturate(1.5);backdrop-filter:blur(24px) saturate(1.5);box-shadow:0 1px 0 rgba(255,255,255,.08)}
  .tabs.stuck::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:env(safe-area-inset-top,0px);background:inherit}
  .list{overflow:visible;padding:4px 6px calc(118px + env(safe-area-inset-bottom))}
  .stage{--disc:min(80vw,44vh,380px);position:fixed;inset:0;z-index:30;max-width:none;align-self:stretch;justify-self:stretch;justify-content:center;padding:calc(56px + env(safe-area-inset-top)) 28px calc(28px + env(safe-area-inset-bottom));
    background:rgba(12,10,9,.28);
    transform:translateY(100%);visibility:hidden;transition:transform .38s cubic-bezier(.2,.8,.2,1),visibility .38s;touch-action:none}
  .stage.open{transform:none;visibility:visible}
  #close{display:grid;position:absolute;top:calc(8px + env(safe-area-inset-top));left:50%;margin-left:-22px}
  .stage.dragging{transition:none}
  .vol{display:none}
  .t{font-size:22px}
  /* 播放栏：悬浮的毛玻璃胶囊，底色是封面主色压暗（换歌跟着变）；封面是不转的圆角小方块；
     进度是播放键外面的一圈细环；第二行有歌词时显示正在唱的那句；左右滑切歌 */
  .mini{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:20;display:flex;align-items:center;gap:2px;padding:8px 8px 8px 9px;
    border-radius:24px;overflow:hidden;background:var(--theme-glass,var(--glass-strong));-webkit-backdrop-filter:blur(28px) saturate(1.6);backdrop-filter:blur(28px) saturate(1.6);
    border:1px solid rgba(255,255,255,.14);box-shadow:0 16px 40px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08);cursor:pointer;transition:background .6s}
  .mini-open{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:0;background:none;padding:0;text-align:left;cursor:pointer;color:inherit;transition:transform .25s cubic-bezier(.2,.8,.2,1),opacity .25s}
  .mini.swiping .mini-open{transition:none}
  .mini .thumb{width:46px;height:46px;border-radius:11px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
  .mini .thumb.noart::after{font-size:19px}
  .mini-meta{min-width:0;display:flex;flex-direction:column;gap:2px}
  #miniT{font-weight:650;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #miniA{font-size:13px;color:rgba(255,255,255,.62);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #miniA.lyric{color:rgba(255,255,255,.9)}
  .mini .icon{width:44px;height:44px;opacity:1}
  #miniPlay{position:relative}
  #miniPlay .ic{width:20px;height:20px}
  .mini-ring{position:absolute;inset:3px;width:38px;height:38px;transform:rotate(-90deg);pointer-events:none}
  .mini-ring circle{fill:none;stroke-width:2.4}
  .mini-ring .bg{stroke:rgba(255,255,255,.18)}
  .mini-ring .fg{stroke:var(--theme,#fb923c);stroke-linecap:round;stroke-dasharray:113.1;stroke-dashoffset:113.1;filter:brightness(1.25)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
(function(){
  'use strict';
  function $(id){ return document.getElementById(id); }
  var audio = $('audio'), list = $('list');
  var tracks = [], byId = {}, curId = null, loaded = false;
  var retries = 0, retryTimer = 0, seeking = false, bgFront = 1, toastTimer = 0;
  var narrow = window.matchMedia('(max-width: 899px)');
  // tab：歌单显示「全部」还是「我喜欢」；ctx：正在放的这首是从哪一页点的，上一首/下一首就在那一页里切
  // glow：音柱的颜色，theme 跟着封面 / rainbow 彩虹；lastPos：上次那首听到第几秒
  var prefs = { repeat: 'all', shuffle: false, volume: 1, last: null, tab: 'all', ctx: 'all', glow: 'theme', lastPos: 0 };
  try { Object.assign(prefs, JSON.parse(localStorage.getItem('xm-prefs') || '{}')); } catch (e) {}
  if(['fav', 'artist', 'list', 'recent'].indexOf(prefs.tab) < 0) prefs.tab = 'all';
  if(['fav', 'artist', 'list', 'recent'].indexOf(prefs.ctx) < 0) prefs.ctx = 'all';
  if(['theme', 'rainbow'].indexOf(prefs.glow) < 0) prefs.glow = 'theme';
  // 封面的主色（色相、饱和度），音柱、进度条都用它
  var themeH = 28, themeS = 90;
  // 最近播放：消息号，最近的在前；recentSnap：从「最近」页点歌时冻结的顺序（不然边放边变，上一首/下一首会乱跳）
  var recent = readRecent(), recentSnap = null, loggedId = null;
  // 继续播放：打开页面时接着上次的进度（等音频载好再跳过去）
  var pendingSeek = null, lastSave = 0;
  // 定时关闭：sleepAt 是到点的时间戳；sleepEnd 是「播完这首就停」
  var sleepAt = 0, sleepEnd = false;
  function savePrefs(){ try { localStorage.setItem('xm-prefs', JSON.stringify(prefs)); } catch (e) {} }
  // favs：收藏的消息号，新收藏的在前；pos：正在放的这首在播放顺序里排第几；seen：封面加载过没有
  var favs = readFavs(), pos = 0, seen = {};
  // 歌词：lyr 是当前这首的（lines 是 [[秒, 这句], ...]，没有时间轴时秒是 null）；lyricCache 存这次打开页面后取过的
  var lyr = { id: null, state: 'idle', synced: false, lines: [], els: [], cur: -1, src: '' };
  var lyricCache = {}, lyricsOn = false, userScrollUntil = 0;
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

  function el(tag, cls, text){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(text != null) e.textContent = text;
    return e;
  }
  function fmt(s){
    s = Math.max(0, Math.floor(s || 0));
    var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = String(s % 60).padStart(2, '0');
    return h ? h + ':' + String(m).padStart(2, '0') + ':' + r : m + ':' + r;
  }
  // ?v= 变了，浏览器就不用缓存里的旧封面（换掉台标封面时改过一次）
  // art=1：只要这首歌自己的专辑图；没有的话网页自己画文字封面。歌单宫格可以用频道图片（photoUrl）
  function coverUrl(id){ return '/c/' + id + '?v=4&art=1'; }
  function photoUrl(id){ return '/c/' + id + '?v=3'; }
  // 没有封面的歌：按歌名算一个固定的色相，做成渐变色块，上面放歌名第一个字
  function hue(text){
    var h = 7;
    for(var i = 0; i < text.length; i++) h = (h * 31 + text.charCodeAt(i)) >>> 0;
    return h % 360;
  }
  function gradient(t){
    var h = hue(t.title + t.artist);
    return 'linear-gradient(135deg, hsl(' + h + ' 62% 58%), hsl(' + (h + 38) % 360 + ' 70% 30%))';
  }
  function firstChar(t){ return Array.from(t.title.trim() || '🍊')[0]; }
  function artistOf(t){ return t.artist || '小橘音乐'; }
  function setIcon(btn, name, label){
    btn.querySelector('use').setAttribute('href', '#i-' + name);
    if(label) btn.setAttribute('aria-label', label);
  }
  // undo：给了就在提示后面放一个「撤销」按钮
  function toast(msg, undo){
    var t = $('toast');
    t.textContent = msg;
    if(undo){
      var b = el('button', null, '撤销');
      b.type = 'button';
      b.addEventListener('click', function(){ hideToast(); undo(); });
      t.appendChild(b);
    }
    t.classList.toggle('act', !!undo);
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, undo ? 5000 : 3200);
  }
  function hideToast(){ $('toast').classList.remove('show', 'act'); }
  // 先铺好渐变色块；封面加载成功就盖上去，失败（这首没有封面）就留着色块
  // anyPic：频道图片也行（歌单宫格）；否则只认自己的专辑图，没有就是渐变底 + 文字
  function coverImg(img, holder, id, anyPic){
    var t = byId[id], key = (anyPic ? 'p' : '') + id;
    if(t){
      holder.style.background = gradient(t);
      holder.dataset.ch = firstChar(t);
      var fb = holder.querySelector('.cover-fallback');
      if(fb){ // 唱片中间的大文字封面：歌名 + 歌手
        fb.textContent = '';
        fb.appendChild(el('b', null, t.title));
        fb.appendChild(el('small', null, artistOf(t)));
      }

    } catch (e) {}

  var usedArt = {}; // 这一屏歌单卡片已经用过的专辑图：同一首歌的图不在两张卡片上重复出现

      if(!sw) return;
      var dx = e.touches[0].clientX - sw.x, dy = e.touches[0].clientY - sw.y;
      if(!sw.dir){
        if(Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
        if(Math.abs(dx) < Math.abs(dy) * 1.3){ sw = null; return; } // 竖着划：正常滚动
        sw.dir = 'h';
        list.classList.add('swiping');
      }
      e.preventDefault();
      sw.dx = dx;
      var i = TABS.indexOf(prefs.tab), inGroup = OPEN[prefs.tab] && prefs[OPEN[prefs.tab]] != null;
      var edge = (dx > 0 && i <= 0 && !inGroup) || (dx < 0 && i >= TABS.length - 1);
      list.style.transform = 'translateX(' + dx * (edge ? .12 : .35) + 'px)'; // 已经是第一页/最后一页：拉不太动
      list.style.opacity = String(edge ? 1 : Math.max(.4, 1 - Math.abs(dx) / 400));
    }, { passive: false });
    function end(e){
      if(!sw) return;
      var d = sw;
      sw = null;
      list.classList.remove('swiping');
      if(d.dir !== 'h') return;
      swipedAt = Date.now();
      var i = TABS.indexOf(prefs.tab), dir = d.dx < 0 ? 1 : -1, next = TABS[i + dir];
      // 在歌单/歌手详情里往右滑：返回上一层（和 iPhone 习惯一致），不是切页签
      var back = dir < 0 && OPEN[prefs.tab] && prefs[OPEN[prefs.tab]] != null;
      if(e.type === 'touchcancel' || Math.abs(d.dx) < 70 || (!next && !back)){
        list.style.transform = ''; list.style.opacity = '';
        return;
      }
      list.style.transform = 'translateX(' + (-dir * 60) + 'px)';
      list.style.opacity = '0';
      setTimeout(function(){
        if(back) openGroup(prefs.tab, null); else setTab(next);
        list.classList.add('swiping');
        list.style.transform = 'translateX(' + (dir * 60) + 'px)'; // 新的一页从另一边滑进来
        void list.offsetWidth;
        list.classList.remove('swiping');
        list.style.transform = ''; list.style.opacity = '';
      }, 160);
    }
    panel.addEventListener('touchend', end);
    panel.addEventListener('touchcancel', end);
  })();
  // 页签贴到顶上时垫一层毛玻璃
  (function(){
    var panel = document.querySelector('.panel'), tabs = document.querySelector('.tabs');
    panel.addEventListener('scroll', function(){
      tabs.classList.toggle('stuck', narrow.matches && panel.scrollTop > tabs.offsetTop - 1);
    }, { passive: true });
  })();

  // 页签：全部 / 歌单 / 歌手 / 我喜欢
  function paintTabs(){
    $('tabAll').setAttribute('aria-selected', String(prefs.tab === 'all'));
    $('tabList').setAttribute('aria-selected', String(prefs.tab === 'list'));
    $('tabFav').setAttribute('aria-selected', String(prefs.tab === 'fav'));
    $('tabArtist').setAttribute('aria-selected', String(prefs.tab === 'artist'));
    $('tabRecent').setAttribute('aria-selected', String(prefs.tab === 'recent'));
    var g = OPEN[prefs.tab] && prefs[OPEN[prefs.tab]] != null && loaded ? groupOf(prefs.tab, prefs[OPEN[prefs.tab]]) : null;
    $('q').placeholder = prefs.tab === 'fav' ? '在「我喜欢」里搜索' : prefs.tab === 'recent' ? '在「最近」里搜索'
      : g ? '在「' + g.name + '」里搜索'
      : prefs.tab === 'artist' ? '搜索歌手' : prefs.tab === 'list' ? '搜索歌单' : '搜索歌名或歌手';
  }
  function setTab(tab){
    if(prefs.tab === tab){
      if(OPEN[tab] && prefs[OPEN[tab]] != null) openGroup(tab, null); // 在某个歌手/歌单里再点页签：回到列表
      return;
    }
    prefs.tab = tab;
    savePrefs();
    paintTabs();
    list.scrollTop = 0;
    // 手机上整页在滚：翻得很深时回到列表开头（页签还贴在顶上），没翻下去就不动
    if(narrow.matches){
      var panel = document.querySelector('.panel'), top = list.offsetTop - document.querySelector('.tabs').offsetHeight;
      if(panel.scrollTop > top) panel.scrollTop = top;
    }
    if(loaded) render();
  }
  $('tabAll').addEventListener('click', function(){ setTab('all'); });
  $('tabFav').addEventListener('click', function(){ setTab('fav'); });
  $('tabArtist').addEventListener('click', function(){ setTab('artist'); });
  $('tabList').addEventListener('click', function(){ setTab('list'); });
  $('tabRecent').addEventListener('click', function(){ setTab('recent'); });
  $('like').addEventListener('click', function(){ if(curId !== null) toggleFav(curId, this); });
  // 同一台设备开着两个页面：一边收藏了，另一边跟着变
  window.addEventListener('storage', function(e){
    if(e.key !== 'xm-favs' && e.key !== null) return;
    favs = readFavs();
    favsChanged();
  });

  // 手机上的全屏「正在播放」
  function openStage(){
    if($('stage').classList.contains('open')) return;
    $('stage').classList.add('open');
    document.body.classList.add('sheet-open');
    if(narrow.matches) history.pushState({ xm: 'stage' }, '', location.hash);
  }
  function closeStage(fromHistory){
    if(!$('stage').classList.contains('open')) return;
    $('stage').classList.remove('open');
    document.body.classList.remove('sheet-open');
    if(!fromHistory) popOurs('stage');
  }
  // 系统返回（iPhone 左边缘右滑、安卓返回键、电脑浏览器后退）：先收播放页，再退出歌单/歌手详情
  window.addEventListener('popstate', function(){
    // 退回去的那条记录里存的是当时那首歌的消息号：换回正在放的这首，不然刷新页面会跳回旧的歌
    if(curId !== null && location.hash !== '#' + curId) history.replaceState(history.state, '', '#' + curId);
    if(ignorePop){ ignorePop = false; return; }
    if($('stage').classList.contains('open')){ closeStage(true); return; }
    var k = prefs.tab;
    if(OPEN[k] && prefs[OPEN[k]] != null) openGroup(k, null, true);
  });
  // 迷你播放条：点哪儿都展开（播放、下一首两个按钮除外）
  $('mini').addEventListener('click', function(e){
    if(miniSwiped) return;
    if(!e.target.closest('#miniPlay, #miniNext')) openStage();
  });
  // 播放栏左右滑：往左下一首，往右上一首（滑过 60px 松手才算，竖着划不管）
  var mdrag = null, miniSwiped = false, mini = $('mini'), miniOpen = $('miniOpen');
  mini.addEventListener('touchstart', function(e){
    if(e.touches.length > 1) return;
    mdrag = { x: e.touches[0].clientX, y: e.touches[0].clientY, dx: 0, dir: '' };
  }, { passive: true });
  mini.addEventListener('touchmove', function(e){
    if(!mdrag) return;
    var dx = e.touches[0].clientX - mdrag.x, dy = e.touches[0].clientY - mdrag.y;
    if(!mdrag.dir){
      if(Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      if(Math.abs(dy) > Math.abs(dx)){ mdrag = null; return; }
      mdrag.dir = 'h';
      mini.classList.add('swiping');
    }
    e.preventDefault();
    mdrag.dx = dx;
    miniOpen.style.transform = 'translateX(' + dx * .6 + 'px)';
    miniOpen.style.opacity = String(Math.max(.25, 1 - Math.abs(dx) / 220));
  }, { passive: false });
  function endMiniDrag(e){
    if(!mdrag) return;
    var d = mdrag;
    mdrag = null;
    mini.classList.remove('swiping');
    if(d.dir !== 'h') return;
    miniSwiped = true;
    setTimeout(function(){ miniSwiped = false; }, 400);
    if(e.type !== 'touchcancel' && Math.abs(d.dx) > 60){
      var dir = d.dx < 0 ? 1 : -1;
      miniOpen.style.transform = 'translateX(' + (-dir * 120) + 'px)';
      miniOpen.style.opacity = '0';
      setTimeout(function(){
        step(dir);
        mini.classList.add('swiping');
        miniOpen.style.transform = 'translateX(' + (dir * 80) + 'px)'; // 新的一首从另一边滑进来
        void miniOpen.offsetWidth;
        mini.classList.remove('swiping');
        miniOpen.style.transform = '';
        miniOpen.style.opacity = '';
      }, 180);
    } else {
      miniOpen.style.transform = '';
      miniOpen.style.opacity = '';
    }
  }
  mini.addEventListener('touchend', endMiniDrag);
  mini.addEventListener('touchcancel', endMiniDrag);
  // 手机上的播放页：按住往下拖收起（拖过 110px 松手就收，不到就弹回），往上拖切到下一首（拖过 90px）。
  // 拖进度条、横着划都不算
  var drag = null, stage = $('stage'), now = $('now'), swapping = false;
  stage.addEventListener('touchstart', function(e){
    if(!narrow.matches || !stage.classList.contains('open') || e.touches.length > 1 || e.target.closest('input, .lyrics')) return;
    drag = { x: e.touches[0].clientX, y: e.touches[0].clientY, dy: 0, dir: '' };
  }, { passive: true });
  stage.addEventListener('touchmove', function(e){
    if(!drag) return;
    var dx = e.touches[0].clientX - drag.x, dy = e.touches[0].clientY - drag.y;
    if(!drag.dir){
      if(Math.abs(dx) < 8 && Math.abs(dy) < 8) return; // 还看不出往哪边划
      if(Math.abs(dx) > Math.abs(dy)){ drag = null; return; }
      drag.dir = dy > 0 ? 'down' : 'up';
      stage.classList.add('dragging');
    }
    e.preventDefault(); // 别让页面跟着一起滚、一起回弹
    drag.dy = dy;
    if(drag.dir === 'down'){
      stage.style.transform = 'translateY(' + Math.max(0, dy) + 'px)';
    } else {
      var up = Math.min(0, dy);
      now.style.transform = 'translateY(' + up * 0.6 + 'px)';
      now.style.opacity = String(Math.max(0.3, 1 + up / 300));
    }
  }, { passive: false });
  function endDrag(e){
    if(!drag) return;
    var d = drag, cancel = e.type === 'touchcancel';
    drag = null;
    stage.classList.remove('dragging');
    if(d.dir === 'down'){
      stage.style.transform = '';
      if(!cancel && d.dy > 110) closeStage(false);
    } else if(d.dir === 'up'){
      if(!cancel && d.dy < -90) swipeNext();
      else { now.style.transform = ''; now.style.opacity = ''; }
    }
  }
  // 这首往上滑走，下一首从下面滑上来
  function swipeNext(){
    if(swapping) return;
    swapping = true;
    now.style.transform = 'translateY(-110px)';
    now.style.opacity = '0';
    setTimeout(function(){
      step(1);
      now.classList.add('instant');
      now.style.transform = 'translateY(110px)';
      void now.offsetWidth; // 先瞬间挪到下面，再滑上来
      now.classList.remove('instant');
      now.style.transform = '';
      now.style.opacity = '';
      swapping = false;
    }, 200);
  }
  stage.addEventListener('touchend', endDrag);
  stage.addEventListener('touchcancel', endDrag);
  $('close').addEventListener('click', function(){ closeStage(false); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') closeStage(false);
    var tag = (e.target && e.target.tagName) || '';
    if(e.code === 'Space' && !/INPUT|BUTTON|A|TEXTAREA/.test(tag)){ e.preventDefault(); toggle(); }
  });
  narrow.addEventListener('change', function(){ if(!narrow.matches) closeStage(false); });

  if('mediaSession' in navigator){
    var actions = {
      play: start,
      pause: function(){ audio.pause(); },
      previoustrack: function(){ step(-1); },
      nexttrack: function(){ step(1); },
      seekto: function(d){ if(d && isFinite(d.seekTime)) audio.currentTime = d.seekTime; }
    };
    Object.keys(actions).forEach(function(k){ try { navigator.mediaSession.setActionHandler(k, actions[k]); } catch(e){} });
  }

  // ── 载入 ──
  function load(){
    $('status').hidden = true;
    fetch('/api/tracks').then(function(r){
      if(!r.ok) throw new Error(String(r.status));
      return r.json();
    }).then(function(d){
      tracks = d.tracks || [];
      playlists = d.playlists || [];
      hotIds = d.hot || {};
      artistCache = null;
      byId = {};
      tracks.forEach(function(t){ byId[t.id] = t; if(t.art === 0) seen[t.id] = false; }); // 确定没专辑图的直接画文字封面
      loaded = true;
      $('nAll').textContent = tracks.length ? String(tracks.length) : '';
      // 分享链接 #消息号 优先，其次上次听的；只选中不自动出声（浏览器也不允许）
      var want = Number(location.hash.slice(1)) || prefs.last;
      var first = byId[want] && byId[want].playable ? byId[want] : playable()[0];
      if(first && prefs.ctx === 'fav' && !isFav(first.id)) prefs.ctx = 'all';
      if(first && CTX[prefs.ctx]){ // 上次是从某个歌手/歌单点的：这首还在那一组里才接着在那组里切
        var g = groupOf(prefs.ctx, prefs[CTX[prefs.ctx]]);
        if(!g || g.songs.indexOf(first) < 0) prefs.ctx = 'all';
      }
      if(prefs.ctx === 'recent') recentSnap = recent.slice();
      // 上次停在某个歌单/歌手里：补一条记录，系统返回先回到列表
      if(OPEN[prefs.tab] && prefs[OPEN[prefs.tab]] != null && !(history.state && history.state.xm)) history.pushState({ xm: 'group', kind: prefs.tab }, '', location.hash);
      var resume = first && first.id === prefs.last ? prefs.lastPos : 0;
      paintTabs();
      render();
      if(first){
        select(first.id);
        // 继续播放：接着上次的进度（点播放后跳过去）
        if(resume > 5 && resume < first.duration - 5){
          pendingSeek = { id: first.id, t: resume };
          prefs.lastPos = resume;
          paint(resume, first.duration);
        }
      }
    }).catch(function(){
      list.textContent = '';
      list.classList.remove('skeleton');
      var s = $('status');
      s.hidden = false;
      s.textContent = '歌单加载失败';
      var retry = el('button', null, '重试');
      retry.type = 'button';
      retry.addEventListener('click', function(){ skeleton(); load(); });
      s.appendChild(retry);
    });
  }

  paintModes();
  paintTabs();
  syncPlay();
  skeleton();
  load();
})();
</script>
</body>
</html>
