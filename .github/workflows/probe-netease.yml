# 临时：网页现在能不能用（只看状态码和条数）；Cloudflare 记下的定时任务
name: Probe NetEase VIP
on:
  push:
    branches: [claude/probe-netease-search]
jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          sleep 60
          curl -s -o t.json -w "api/tracks: %{http_code}\n" https://xiaoju-music.langhua98.workers.dev/api/tracks
          python3 -c 'import json; d=json.load(open("t.json")); print("tracks", len(d.get("tracks", [])))' 2>/dev/null || head -c 200 t.json; echo
          curl -s -o /dev/null -w "page: %{http_code}\n" https://xiaoju-music.langhua98.workers.dev/
          curl -s "https://api.cloudflare.com/client/v4/accounts/aca35ff5f62ae4208757219dbc3b489b/workers/scripts/xiaoju-music/schedules" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -c 'import json,sys; print("schedules", [s["cron"] for s in json.load(sys.stdin)["result"]["schedules"]])'
