# 临时：看 Worker 的定时任务跑没跑、有没有出错（只输出定时任务的 cron、结果、报错，不输出访客请求）
name: Probe NetEase VIP
on:
  push:
    branches: [claude/probe-netease-search]
jobs:
  tail:
    runs-on: ubuntu-latest
    steps:
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aca35ff5f62ae4208757219dbc3b489b
        run: |
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/xiaoju-music/schedules" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("schedules", d.get("result"), d.get("errors"))'
          timeout 150 npx -y wrangler@3 tail xiaoju-music --format json > tail.jsonl 2> tail.err || true
          tail -3 tail.err | cut -c1-200
          python3 - <<'PY'
          import json
          n = 0
          for line in open('tail.jsonl', encoding='utf-8'):
              try: e = json.loads(line)
              except Exception: continue
              ev = e.get('event') or {}
              if 'cron' not in ev: continue
              n += 1
              print('cron', ev.get('cron'), '| outcome', e.get('outcome'), '| cpu/wall', e.get('cpuTime'), e.get('wallTime'),
                    '| exceptions', [x.get('message') for x in e.get('exceptions') or []][:3],
                    '| logs', [str(l.get('message'))[:200] for l in e.get('logs') or []][:5])
          print('scheduled events seen:', n)
          PY
