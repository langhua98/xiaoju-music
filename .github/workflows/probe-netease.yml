# 临时：api-enhanced 4.41.1 在 Space 用的 Debian bookworm 自带 Node 上能不能跑
name: Probe NetEase VIP
on:
  push:
    branches: [claude/probe-netease-search]
jobs:
  node18:
    runs-on: ubuntu-latest
    steps:
      - run: |
          docker run --rm debian:bookworm-slim sh -c '
            apt-get update -qq && apt-get install -y -qq --no-install-recommends nodejs npm ca-certificates curl >/dev/null
            node --version
            mkdir /opt/netease-api && cd /opt/netease-api && npm init -y >/dev/null && npm install --omit=dev --ignore-scripts --silent @neteasecloudmusicapienhanced/api@4.41.1
            du -sh /opt/netease-api
            (PORT=3017 HOST=127.0.0.1 node /opt/netease-api/node_modules/@neteasecloudmusicapienhanced/api/app.js >/tmp/api.log 2>&1 &)
            sleep 10
            curl -s "http://127.0.0.1:3017/cloudsearch?keywords=%E5%B0%8F%E6%A9%98&type=1&limit=2" | head -c 300; echo
            curl -s "http://127.0.0.1:3017/song/url/v1?id=3421291463&level=exhigh" | head -c 300; echo
            curl -s "http://127.0.0.1:3017/login/qr/key?timestamp=1" | head -c 80; echo
            tail -5 /tmp/api.log'
