# 临时：抓 Worker 定时任务的日志（只输出定时任务的 cron、结果、报错和它自己打的日志，不输出访客请求）
name: Probe NetEase VIP
on:
  push:
    branches: [claude/probe-netease-search]
jobs:
  tail:
    runs-on: ubuntu-latest
    steps:
      - run: npm install -g wrangler@3 --silent 2>/dev/null; wrangler --version
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aca35ff5f62ae4208757219dbc3b489b
        run: |
          timeout 150 wrangler tail xiaoju-music --format json > tail.jsonl 2> tail.err || true
          grep -v "^\s*$" tail.err | tail -5 | cut -c1-200
          python3 - <<'PY'
          import json, re
          n = 0
          text, dec, i, items = open('tail.jsonl', encoding='utf-8').read(), json.JSONDecoder(), 0, []
          while True:
              j = text.find('{', i)
              if j < 0: break
              try:
                  obj, i = dec.raw_decode(text, j)
                  items.append(obj)
              except Exception:
                  i = j + 1
          for e in items:
              if not isinstance(e, dict): continue
              ev = e.get('event') if isinstance(e.get('event'), dict) else {}
              if 'cron' not in ev: continue
              n += 1
              logs = [re.sub(r'MUSIC_U=[^;" ]+', 'MUSIC_U=<redacted>', ' '.join(map(str, l.get('message') or [])))[:600] for l in e.get('logs') or []]
              print('cron', ev.get('cron'), '| outcome', e.get('outcome'), '| exceptions', [x.get('message') for x in e.get('exceptions') or []][:3])
              for l in logs: print('   ', l)
          print('scheduled events seen:', n)
          PY
