# 临时：抓 /api/tracks 的 500 和定时任务的报错（只看自己发的 /api/tracks 请求和 cron，不输出访客请求）
name: Probe NetEase VIP
on:
  push:
    branches: [claude/probe-netease-search]
jobs:
  tail:
    runs-on: ubuntu-latest
    steps:
      - run: npm install -g wrangler@3 --silent 2>/dev/null; wrangler --version
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aca35ff5f62ae4208757219dbc3b489b
        run: |
          (timeout 150 wrangler tail xiaoju-music --format json > tail.jsonl 2> tail.err || true) &
          sleep 25
          for i in 1 2 3 4; do curl -s -o /dev/null -w "api/tracks: %{http_code}\n" "https://xiaoju-music.langhua98.workers.dev/api/tracks?probe=$i"; sleep 20; done
          wait
          grep -v "^\s*$" tail.err | tail -5 | cut -c1-200
          python3 - <<'PY'
          import json, re
          text, dec, i, items = open('tail.jsonl', encoding='utf-8').read(), json.JSONDecoder(), 0, []
          while True:
              j = text.find('{', i)
              if j < 0: break
              try:
                  obj, i = dec.raw_decode(text, j); items.append(obj)
              except Exception:
                  i = j + 1
          n = 0
          for e in items:
              if not isinstance(e, dict): continue
              ev = e.get('event') if isinstance(e.get('event'), dict) else {}
              url = ((ev.get('request') or {}).get('url') or '')
              if 'cron' not in ev and 'probe=' not in url: continue
              n += 1
              logs = [re.sub(r'MUSIC_U=[^;" ]+', 'MUSIC_U=<redacted>', ' '.join(map(str, l.get('message') or [])))[:1500] for l in e.get('logs') or []]
              print(ev.get('cron') or url, '| outcome', e.get('outcome'), '| exceptions', [x.get('message') for x in e.get('exceptions') or []][:3])
              for l in logs: print('   ', l)
          print('events seen:', n)
          PY
