# 临时：Cloudflare 记下的定时任务每次运行（时间、cron、结果、CPU）
name: Probe NetEase VIP
on:
  push:
    branches: [claude/probe-netease-search]
jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, datetime
          since = (datetime.datetime.utcnow() - datetime.timedelta(hours=8)).strftime('%Y-%m-%dT%H:%M:%SZ')
          q = '''query($acc: String!, $since: Time!) { viewer { accounts(filter: {accountTag: $acc}) {
            workersInvocationsScheduled(filter: {scriptName: "xiaoju-music", datetime_geq: $since}, limit: 30, orderBy: [datetime_DESC]) {
              datetime cron status cpuTimeUs } } } }'''
          body = json.dumps({'query': q, 'variables': {'acc': 'aca35ff5f62ae4208757219dbc3b489b', 'since': since}}).encode()
          req = urllib.request.Request('https://api.cloudflare.com/client/v4/graphql', data=body, headers={
              'Authorization': 'Bearer ' + os.environ['CLOUDFLARE_API_TOKEN'], 'Content-Type': 'application/json'})
          d = json.load(urllib.request.urlopen(req, timeout=30))
          if d.get('errors'): print('errors', d['errors'])
          rows = (((d.get('data') or {}).get('viewer') or {}).get('accounts') or [{}])[0].get('workersInvocationsScheduled') or []
          print('rows', len(rows))
          for r in rows: print(r)
          PY
