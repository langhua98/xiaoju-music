name: Probe NetEase search
on:
  push:
    branches: [claude/probe-netease-search]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          UA = 'XiaojuMusicHarvester/1.0 (https://xiaoju-music.langhua98.workers.dev; own-song importer)'
          H = {'User-Agent': UA, 'Referer': 'https://music.163.com/'}
          q = urllib.parse.quote('小橘')
          d = json.load(urllib.request.urlopen(urllib.request.Request(f'https://music.163.com/api/search/get?s={q}&type=1&limit=8&offset=0', headers=H), timeout=20))
          for s in d['result']['songs']:
              url = f"https://music.163.com/song/media/outer/url?id={s['id']}.mp3"
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, headers=H), timeout=30)
                  data = r.read(400000)
                  print(s['id'], s['name'][:20], '| fee', s.get('fee'), '| ->', r.geturl()[:70], '|', r.headers.get('Content-Type'), '| len', r.headers.get('Content-Length'), '| head', data[:16])
              except Exception as e:
                  print(s['id'], s['name'][:20], '| fee', s.get('fee'), '| error', e)
          PY
